<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Blackout Bingo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Team Selection Modal -->
    <div id="team-modal" class="modal">
        <div class="modal-content">
            <h2>Select Your Team</h2>
            <button id="btn-red" class="team-btn red-btn">Red Team</button>
            <button id="btn-blue" class="team-btn blue-btn">Blue Team</button>
        </div>
    </div>

    <!-- Main Game UI -->
    <header>
        <div class="score-board">
            <div id="score-red" class="score red-score">Red: 0</div>
            <h1>BINGO</h1>
            <div id="score-blue" class="score blue-score">Blue: 0</div>
        </div>
        <div id="player-indicator"></div>
    </header>

    <main>
        <div id="bingo-grid" class="grid-7x7">
            <!-- Squares will be generated by Javascript -->
        </div>
    </main>

    <!-- Load script as a module so Firebase works via CDN -->
    <script type="module" src="script.js"></script>
</body>
</html>
